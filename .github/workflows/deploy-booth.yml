name: deploy-booth

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: install python
        run: pip install -e .
      - name: install video studio
        working-directory: video
        run: npm ci
      - name: build Falcons at Packers pack
        run: python -m outputs.video_pack --league nfl --game ATL@GB --show "Thursday Night Football" --tag TNF
      - name: export static booth
        working-directory: video
        run: node scripts/export-booth.mjs --out booth/site --base /chase-content-engine/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: video/booth/site
      - id: deployment
        uses: actions/deploy-pages@v4
