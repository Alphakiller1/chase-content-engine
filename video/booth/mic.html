<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Booth mic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0e;
        --card: #16161c;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #f5b942;
        --go: #22c55e;
        --bad: #f2545b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 420px; margin: 0 auto; padding: 48px 24px 80px; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
      h1 { font-size: 34px; line-height: 1.05; margin: 8px 0 12px; }
      p { color: var(--muted); line-height: 1.45; }
      code { color: var(--text); font-weight: 800; letter-spacing: 0.08em; }
      input {
        width: 100%;
        margin-top: 12px;
        border: 1px solid #3f3f46;
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 14px 16px;
      }
      button {
        width: 100%;
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 18px 20px;
        font-size: 18px;
        font-weight: 800;
        background: var(--go);
        color: #052e16;
      }
      button.off { background: var(--card); color: var(--text); }
      .meter { height: 10px; background: #27272a; border-radius: 999px; overflow: hidden; margin-top: 28px; }
      .meter > div { height: 100%; width: 0; background: var(--go); }
      .status { margin-top: 18px; font-weight: 700; }
      .status.wait { color: var(--accent); }
      .status.live { color: var(--go); }
      .status.err { color: var(--bad); }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Recording booth</div>
      <h1>This phone is the microphone.</h1>
      <p>The desktop camera stays on the computer. Open this link from Setup on the booth, tap Allow, and keep the page open a foot from your mouth.</p>
      <input id="room" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="8" placeholder="ROOM CODE" />
      <button id="go" type="button">Use this phone as the mic</button>
      <div class="meter"><div id="bar"></div></div>
      <div class="status wait" id="st">Waiting — enter the code from the computer if it is not already in the link.</div>
    </main>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
      const st = document.getElementById("st");
      const bar = document.getElementById("bar");
      const go = document.getElementById("go");
      const roomEl = document.getElementById("room");
      const say = (t, k) => { st.textContent = t; st.className = "status " + (k || "wait"); };
      const params = new URLSearchParams(location.search);
      if (params.get("room")) roomEl.value = params.get("room").toUpperCase();

      const peerIdFor = (room) => "chasebooth-" + String(room).trim().toLowerCase();

      const level = (s) => {
        const ctx = new AudioContext();
        const src = ctx.createMediaStreamSource(s);
        const an = ctx.createAnalyser();
        an.fftSize = 1024;
        src.connect(an);
        const buf = new Float32Array(an.fftSize);
        const tick = () => {
          an.getFloatTimeDomainData(buf);
          let sum = 0;
          for (const v of buf) sum += v * v;
          const db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-9);
          bar.style.width = Math.max(0, Math.min(1, (db + 60) / 60)) * 100 + "%";
          requestAnimationFrame(tick);
        };
        tick();
      };

      const start = async () => {
        const room = roomEl.value.trim().toUpperCase();
        if (!/^[A-Z0-9]{5}$/.test(room)) {
          say("Type the 5-character code shown on the computer.", "err");
          return;
        }
        go.disabled = true;
        say("Asking for the microphone…");
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
            video: false,
          });
        } catch (e) {
          go.disabled = false;
          say("Microphone blocked: " + e.message, "err");
          return;
        }
        level(stream);
        say("Connecting to the booth…");
        const peer = new Peer();
        peer.on("error", (err) => {
          go.disabled = false;
          say("Could not reach the booth (" + err.type + "). On the computer, set Microphone to Phone and keep that page open.", "err");
        });
        peer.on("open", () => {
          const call = peer.call(peerIdFor(room), stream);
          if (!call) {
            go.disabled = false;
            say("No booth with that code. Select Phone on the computer, then try again.", "err");
            return;
          }
          call.on("stream", () => {});
          call.on("error", (err) => say("Call failed: " + err, "err"));
          say("Live — leave this page open. Desktop camera is unchanged.", "live");
          go.textContent = "Mic is live";
          go.classList.add("off");
        });
      };
      go.onclick = start;
      if (roomEl.value) say("Code " + roomEl.value + " is in the link. Tap the button, then Allow microphone.");
    </script>
  </body>
</html>
